site_name: Trakk
site_description: Proof of progress — a transparent work log system.
site_author: Trakk

site_url: https://jiayee.github.io/trakk/

repo_url: https://github.com/JiaYee/trakk
repo_name: JiaYee/trakk

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: grey
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: grey
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Projects:
    - FOS System Mobile:
      - Overview: projects/fos-system-mobile/index.md
      - October 2025: projects/fos-system-mobile/2025-10.md
      - November 2025: projects/fos-system-mobile/2025-11.md
      - December 2025: projects/fos-system-mobile/2025-12.md
      - January 2026: projects/fos-system-mobile/2026-01.md
      - February 2026: projects/fos-system-mobile/2026-02.md
      - March 2026: projects/fos-system-mobile/2026-03.md
      - April 2026: projects/fos-system-mobile/2026-04.md
      - May 2026: projects/fos-system-mobile/2026-05.md
      - June 2026: projects/fos-system-mobile/2026-06.md
    - Project A:
      - Overview: projects/project-a/index.md
      - June 2026: projects/project-a/2026-06.md
      - July 2026: projects/project-a/2026-07.md
    - Project B:
      - Overview: projects/project-b/index.md
      - June 2026: projects/project-b/2026-06.md

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

extra:
  generator: false

extra_javascript:
  - javascripts/vendor/jspdf.umd.min.js
  - javascripts/vendor/jspdf.plugin.autotable.min.js
  - javascripts/log-filter.js
  - javascripts/log-pdf.js

extra_css:
  - stylesheets/log-filter.css

copyright: Copyright &copy; Trakk
