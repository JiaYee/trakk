site_name: Trakk
site_description: Proof of progress — a transparent work log system.
site_author: Trakk

site_url: https://jiayee.github.io/trakk/

repo_url: https://github.com/JiaYee/trakk
repo_name: JiaYee/trakk

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: grey
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: grey
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Projects:
    - Project A:
      - Overview: projects/project-a/index.md
      - June 2026: projects/project-a/2026-06.md
      - July 2026: projects/project-a/2026-07.md
    - Project B:
      - Overview: projects/project-b/index.md
      - June 2026: projects/project-b/2026-06.md

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

extra:
  generator: false

copyright: Copyright &copy; Trakk
